services:
  stealthops:
    build: .
    # Bind to localhost only — nginx handles external traffic on 443.
    # For local testing change to "0.0.0.0:8000:8000".
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      # Copy .env.example to .env and fill in your values.
      # On GCP, have the VM startup script write secrets to this file
      # before starting the container (see docker-entrypoint.sh).
      - .env
    environment:
      CLOUD_MODE: "1"
    volumes:
      - cache_data:/data/cache
    restart: unless-stopped

volumes:
  cache_data:
