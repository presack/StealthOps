# StealthOps nginx reverse proxy config
#
# Installation on the GCP VM:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/stealthops
#   sudo ln -s /etc/nginx/sites-available/stealthops /etc/nginx/sites-enabled/stealthops
#   sudo rm -f /etc/nginx/sites-enabled/default
#
# Then issue a cert (nginx must be reachable on port 80 first):
#   sudo certbot --nginx -d YOUR_DOMAIN_HERE
#
# Certbot will rewrite this file to add the SSL block. Alternatively,
# run certbot once with --nginx to get the certs, then replace with this
# file for a clean config.
#
# Replace every occurrence of YOUR_DOMAIN_HERE before deploying.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN_HERE;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN_HERE;

    # --- TLS (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;

    # --- Compression ---
    gzip on;
    gzip_types text/html application/json text/plain;
    gzip_min_length 1024;

    # --- Proxy to uvicorn ---
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Pass real client IP so app-level rate limiting works correctly.
        # $remote_addr (not $proxy_add_x_forwarded_for) prevents clients
        # from spoofing X-Forwarded-For.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # Enrichment queries hit multiple APIs in parallel and can take
        # up to 60s. Status polling adds another layer; 120s is generous.
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;

        # Don't buffer responses — the status endpoint streams JSON
        # fragments every 400ms during active queries.
        proxy_buffering off;
    }
}
