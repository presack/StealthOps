# StealthOps nginx reverse proxy config — stealthops.dev subdomain deployments
#
# Each training deployment gets its own subdomain, e.g. botswana.stealthops.dev.
# The vm-setup.sh script installs and instantiates this config automatically.
# To do it manually, replace FQDN with the actual subdomain and run:
#
#   export FQDN=botswana.stealthops.dev
#   sudo sed "s/FQDN/$FQDN/g" deploy/nginx.conf \
#       > /etc/nginx/sites-available/stealthops
#   sudo ln -s /etc/nginx/sites-available/stealthops \
#              /etc/nginx/sites-enabled/stealthops
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d $FQDN

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name FQDN;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name FQDN;

    # --- TLS (managed by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/FQDN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FQDN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;

    # --- Compression ---
    gzip on;
    gzip_types text/html application/json text/plain;
    gzip_min_length 1024;

    # --- Proxy to CTFd (at /ctf) ---
    # APPLICATION_ROOT=/ctf is set in the CTFd container so Flask routes
    # /ctf/* internally and generates correct /ctf-prefixed URLs.
    location /ctf {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
    }

    # --- Proxy to uvicorn (StealthOps) ---
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Pass real client IP so app-level rate limiting works correctly.
        # $remote_addr (not $proxy_add_x_forwarded_for) prevents clients
        # from spoofing X-Forwarded-For.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        # Enrichment queries hit multiple APIs in parallel and can take
        # up to 60s. Status polling adds another layer; 120s is generous.
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;

        # Don't buffer — the status endpoint emits JSON fragments every 400ms.
        proxy_buffering off;
    }
}
